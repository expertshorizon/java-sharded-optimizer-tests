expert_time_estimate_hours = 14
difficulty_explanation = """
The starter contains thirteen interacting logic defects across nine Java files: rational sign normalization, exact numeric parsing of decimal/scientific/fraction strings, the fraction-only parsing path used for checkpoint input, raw non-finite poisoning, the inclusive staleness boundary, duplicate-versus-superfluous precedence, frontier-only cascading, whole-quorum poison detection, global L1 clipping, uneven shard partitioning, checkpoint pending/history persistence, and checkpoint pre-drain. The shared JSON layer (com.trainingsim.json.Json) is not one of those defects and is identical in the starter and the reference: it rejects unescaped control characters inside a string, as JSON requires, so a malformed log cannot decode into an altered-but-valid gradient (a literal newline in "1" would otherwise survive parsing and then trim away into the finite value 1). A submission that repairs the optimizer logic in place inherits that strict decoding, and no test feeds malformed JSON, so this is contract hygiene rather than graded behavior. Several faults only become visible after earlier steps move the frontier or a checkpoint restores partially-filled buckets, so fixing one subsystem rarely isolates the rest.

The verifier collects 5 tests, each of which sweeps its whole case set internally rather than fanning out into one test per case, so there is no partial credit for a repair that generalizes to only part of the scenario library. Behind those 5 grouped tests sit 51 deterministic scenarios, a full per-split checkpoint sweep, and hand-built inbound checkpoints. Cases mix fraction/scientific/decimal inputs including signed denominators, raw NaN/Inf tokens, 5-way vectors over 3 shards, blocked future quorums, duplicate/full-bucket precedence, a handcrafted checkpoint whose frontier is already quorate, a checkpoint carrying non-canonical numeric spellings in its parameters and its pending gradients, and a checkpoint taken while a raw-non-finite-token contribution sits in a bucket that has not yet reached quorum. The untouched starter fails the intended regression suite while the reference passes all 5 tests.
"""
solution_explanation = """
The reference keeps all arithmetic in canonical Rational values, parses decimal/scientific/fraction strings exactly through one shared numeric parser used for config, log gradients and inbound checkpoint fields alike, and converts raw non-finite gradient tokens into poisoned submissions. It admits by the current frontier, gives duplicate detection precedence over full-bucket rejection, commits only contiguous frontier quorums, skips poisoned quorums while advancing the frontier, and clips one averaged full-vector gradient before momentum updates. Shard reporting uses contiguous near-even bounds with earlier shards receiving any remainder. Checkpoints preserve pending and rejection state, and an inbound checkpoint is drained before tail events are classified.
"""
verification_explanation = """
The separate verifier recompiles `/app/src` with `javac` and runs the CLI as an unprivileged uid through `setpriv --no-new-privs`, with candidate-writable output files read back through an `O_NOFOLLOW` guard and `/app` made world-readable without following any candidate-planted symlinks, so neither step can be redirected onto a root-owned fixture. `tests/oracle.py` independently reimplements the protocol with Python Fraction arithmetic; 51 scenario outputs are first checked against the native JSON schema — exact integer/boolean/string types, and every emitted rational required to be reduced with a strictly positive denominator, so a value that is arithmetically right but textually non-canonical fails on any run that produces it — and then compared field-for-field. Checkpoint coverage compares the raw `--checkpoint-out` file against the oracle at every arrival index of every scenario, which is where a pending bucket's textual form is decided separately from its arithmetic value, and additionally sweeps resume equivalence at structural boundaries, exercises pre-quorate inbound state, feeds in checkpoints whose parameters, momentum and pending gradients use decimals, scientific notation, explicit plus signs and signed denominators, and pins the checkpoint shape of a raw-non-finite-token contribution still waiting on quorum, and verifies poisoned inbound entries normalize to gradient:null. Golden fixtures remain an independent regression layer, and property tests check determinism, zero-state safety, rejection inertness, canonical fractions, and strict native JSON typing. The suite collects exactly 5 tests. All fifty-odd individual checks live on as plain helper functions in test_outputs.py and in checks_scenarios.py / checks_checkpoint.py / checks_properties.py, and the five collected tests call them in groups: build and isolation self-checks, whole-artifact equality against the goldens and the oracle, admission/resolution/poison boundaries, clipping and sharding and exact rational arithmetic, and checkpoint persistence and resume. Reward is a single binary outcome, so grouping matches the scoring: a fan-out of fifty small tests turns a partial repair into a mostly-green report, whereas one wrong event in any scenario at any checkpoint split fails the group it belongs to. The groups run cheapest-first, so a submission that does not build, or that reaches for the goldens, fails before the long sweeps start. On the unmodified starter, 4 of the 5 fail (the build/isolation group legitimately passes, since the starter compiles). tests/test_outputs.py now carries nine further clause-by-clause checks, each naming the instruction.md sentence it pins and asserting the single value that sentence decides alongside full oracle equality: poison recognition swept over all four documented raw tokens (NaN, Inf, +Inf, -Inf) against every position of a three-component gradient on both of the paths that parse one -- an ordinary --log event and a pending entry loaded from --checkpoint-in, which are distinct deserializers in the shipped code -- with each case required to resolve as poisoned_skip, report no norm or scale, leave no pending bucket in either artifact, advance the frontier, and leave params and momentum untouched; the explicit poisoned flag discarding any finite values a non-normalized checkpoint supplied, checked on a resume whose quorum is never completed so the normalized entry is still in the pending bucket when --checkpoint-out is written (every other inbound-poison case drains to quorum, which removes the bucket and makes the normalization invisible in both artifacts; a loader that keeps the shipped code's gradient-non-null guard writes the supplied values straight back out and fails only this test), locale independence of poison recognition (the same log replayed under Turkish and Lithuanian default locales must produce byte-identical output), the staleness window swept over max_staleness 0 through 3 including the degenerate 0, first-accepted-wins where the duplicate carries different numbers so an overwriting bucket reaches quorum but commits wrong values, clipping applied once to the averaged vector rather than per contribution (per-contribution clipping lands on 1/2 instead of 1 in that fixture), poison at every arrival position in a three-worker quorum with the following step required to commit, canonical rendering of non-canonical input lexemes including inside a serialized pending bucket, and num_shards greater than param_size still emitting present-but-empty tail shards with contiguous ids. Three further cases close the boundaries a panel found unreachable, each confirmed against exactly the submission it exists to reject, which passes every other check: clip_threshold=0, where the contract's single clip of the averaged vector must scale it away (scale 0/1) and a positivity guard on the threshold would read it as clipping disabled; a poisoned submission that was rejected as a duplicate, which must not void a step whose accepted contributions are all clean, since the rule is keyed on accepted contributions rather than on submissions; and an ordinary --log event carrying poisoned:true alongside finite values, left pending so that --checkpoint-out is the only place the normalization is observable. The checkpoint schema validator now couples the two fields directly -- a poisoned pending entry must carry a null gradient and a clean one must not -- so retaining the supplied values fails on any run that produces them, not only on the case that samples them. The shared JSON decoder also rejects a leading zero on a multi-digit integer and restricts inter-token whitespace to the four characters JSON permits, so a malformed document cannot decode as a valid one (worker id 01 silently becoming 1); it is identical in the starter and the reference and is not one of the planted defects. The curated trace/rejection-concatenation and second-generation-checkpoint sweeps sample three split points per scenario rather than two, since two would resolve to only the first and last boundary, i.e. an empty head and an empty tail, and never resume mid-log. That two-path sweep was confirmed against exactly the bypasses it exists to close, each of which passes every other test in the suite: a submission identical to the reference except that its checkpoint loader recognizes only the bare token Inf, and one whose log-event parser inspects only gradient[0] for a poison token. Both fail only this test, out of the 5. The locale check was confirmed the same way, against a reference variant that case-folds tokens with the default locale. Poison detection compares the four spellings literally in both the Java reference and tests/oracle.py rather than lowercasing first, so the poison rule is exactly the contract's four tokens and no wider, and it cannot move with the JVM's default locale; the verifier also strips JAVA_TOOL_OPTIONS, _JAVA_OPTIONS and JDK_JAVA_OPTIONS from every graded child process and pins LC_ALL and LANG, closing the JVM's implicit option channels as an ambient input to grading.
"""
relevant_experience = """
Built and debugged asynchronous / stale-synchronous-parallel data-parallel
training infrastructure and ZeRO-style optimizer state sharding, and have
implemented exact rational arithmetic layers to make distributed
numerical pipelines bit-reproducible for testing.
"""

